<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature Scenes Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <header>
    <h1>Nature Scenes Gallery</h1>
    <nav aria-label="Jump to a scene">
      <ul>
        <li><a href="#scene1">Mountains</a></li>
        <li><a href="#scene2">Ocean</a></li>
        <li><a href="#scene3">Forest</a></li>
        <li><a href="#scene4">Desert</a></li>
        <li><a href="#scene5">City</a></li>
        <li><a href="#scene6">Night</a></li>
        <li><a href="#scene7">Meadow</a></li>
      </ul>
    </nav>
  </header>

  <main class="grid">
    <figure id="scene1">
      <img src="images/mountains.svg" alt="Snow-capped gray mountains under a bright blue sky">
      <p>Tall mountains rise above the valley while the sun warms the peaks.</p>
    </figure>

    <figure id="scene2">
      <img src="images/ocean.svg" alt="Orange sun setting over layered blue ocean waves">
      <p>Gentle waves roll toward the shore as the day comes to an end.</p>
    </figure>

    <figure id="scene3">
      <img src="images/forest.svg" alt="Row of dark green pine trees in a forest">
      <p>Pine trees stand close together, giving shade and shelter to wildlife.</p>
    </figure>

    <figure id="scene4">
      <img src="images/desert.svg" alt="Golden sand dunes beneath a pale yellow sun">
      <p>Warm dunes stretch across the desert in soft, rolling shapes.</p>
    </figure>

    <figure id="scene5">
      <img src="images/city.svg" alt="City skyline at dusk with lit windows in tall buildings">
      <p>The city lights switch on one by one as evening settles in.</p>
    </figure>

    <figure id="scene6">
      <img src="images/night.svg" alt="Pale moon and small white stars in a deep blue night sky">
      <p>A quiet night sky filled with stars and a glowing moon.</p>
    </figure>

    <figure id="scene7">
      <img src="images/meadow.svg" alt="Green meadow dotted with pink, purple and orange flowers">
      <p>Wildflowers bloom across a green meadow on a sunny spring day.</p>
    </figure>
  </main>

  <footer>
    <a href="#top">Back to top</a>
  </footer>
</body>
</html>
